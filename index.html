<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>窗台多肉铺的猫店长</title>
  <meta name="description" content="轻治愈网页解谜养成游戏《窗台多肉铺的猫店长》：接手外婆留下的多肉铺，与三花猫店长一起养花、解谜、等一个温柔轮回。" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="paywall.css" />
</head>
<body>
  <div class="warm-particles" id="warmParticles" aria-hidden="true"></div>

  <main class="shell">
    <section class="start-screen" id="startScreen">
      <div class="cover-card start-cover-card" aria-label="窗台多肉铺的猫店长开始界面">
        <div class="start-menu-panel">
          <p class="eyebrow">轻治愈网页解谜养成</p>
          <p class="cover-copy">回到外婆的窗台多肉铺，和猫店长一起重新营业。</p>
          <div class="start-actions">
            <button class="primary" id="startBtn">开始游戏</button>
            <button class="ghost" id="continueBtn">继续游戏</button>
            <button class="ghost" id="settingsBtn">设置</button>
            <button class="ghost" id="supportBtnStart">1元支持</button>
          </div>
          <p class="notice">本地存档 · 每日 17:00–20:00 限定流星雨</p>
        </div>
      </div>
    </section>

    <section class="game-screen hidden" id="gameScreen">
      <header class="topbar">
        <div>
          <p class="eyebrow">暖色窗台 · 多肉铺营业中</p>
          <h2 id="chapterTitle">空铺初遇</h2>
        </div>
        <div class="top-actions">
          <span class="badge" id="chapterBadge">第 1 / 12 章</span>
          <button class="small" id="supportBtn">1元支持</button>
          <button class="small muted" id="resetBtn">重新开店</button>
        </div>
      </header>

      <section class="focus-bar">
        <span>当前只做一件事</span>
        <strong id="focusText">先安抚躲在花盆后的三花小猫。</strong>
      </section>

      <div class="layout">
        <section class="scene-card">
          <div class="scene-stage" id="sceneStage"></div>
          <div class="main-panel" id="mainPanel"></div>
        </section>

        <aside class="side">
          <section class="cat-card">
            <h3>猫店长状态</h3>
            <button class="cat-button" id="catButton" aria-label="和猫互动"></button>
            <div class="cat-name" id="catName">左耳缺角的小三花</div>
            <div class="cat-stage" id="catStage">初始：炸毛怕生小奶猫</div>
            <div class="cat-actions">
              <button data-care="pet">摸摸</button>
              <button data-care="feed">喂猫粮</button>
              <button data-care="groom">梳毛</button>
              <button data-care="bathe">免洗澡</button>
              <button data-care="play">逗猫棒</button>
            </div>
          </section>

          <details class="side-box" open>
            <summary>营业进度 <span id="progressText">0%</span></summary>
            <div class="meter"><i id="progressBar"></i></div>
            <div class="mini-grid">
              <div>花卉图鉴 <b id="plantCount">0 / 32</b></div>
              <div>成就 <b id="achievementCount">0 / 50</b></div>
              <div>彩蛋 <b id="eggCount">0 / 41</b></div>
            </div>
          </details>

          <details class="side-box">
            <summary>外婆便签与剧情记录</summary>
            <div class="log" id="storyLog"></div>
          </details>

          <details class="side-box">
            <summary>道具与奖励</summary>
            <div class="inventory" id="inventory"></div>
          </details>
        </aside>
      </div>
    </section>
  </main>

  <div class="modal hidden" id="modal">
    <div class="modal-card">
      <button class="modal-close" id="modalClose">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast-host" id="toastHost"></div>

  <script src="paywall.js"></script>
  <script src="game.js"></script>
</body>
</html>
